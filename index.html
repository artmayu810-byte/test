<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Love Letter For You 💌</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffeef4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* หัวข้อด้านบน */
        .header {
            position: absolute;
            top: 50px;
            text-align: center;
            width: 100%;
            transition: opacity 0.5s ease;
            z-index: 10;
        }

        .header h1 {
            color: #d13264;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            color: #e06d93;
            font-size: 15px;
        }

        /* พื้นที่ซองจดหมายและการ์ด */
        .wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* แผ่นการ์ดจดหมาย + น้องหมี */
        .card {
            position: absolute;
            width: 290px;
            height: 270px;
            background: #fffdf8;
            border-radius: 18px;
            border: 3px solid #f3d19c;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
            transform: translateY(0) scale(0.8);
            opacity: 0;
            z-index: 2;
        }

        .card img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .card-text {
            color: #c92a58;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            min-height: 40px;
            line-height: 1.4;
        }

        /* ซองจดหมาย */
        .envelope {
            position: absolute;
            width: 320px;
            height: 220px;
            background: #ffb3c6;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(255, 105, 180, 0.3);
            border: 3px solid #ff80a0;
            transition: transform 0.8s ease, opacity 0.8s ease;
            z-index: 3;
        }

        /* ฝาซองจดหมาย */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 157px solid transparent;
            border-right: 157px solid transparent;
            border-top: 120px solid #ff80a0;
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 4;
        }

        /* ตราประทับหัวใจ */
        .seal {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 42px;
            height: 42px;
            background: #f3d19c;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            z-index: 5;
            transition: opacity 0.4s ease;
        }

        .seal::after {
            content: "❤️";
            font-size: 20px;
        }

        /* เมื่อกดเปิดซอง */
        .wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .wrapper.open .seal {
            opacity: 0;
        }

        .wrapper.open .envelope {
            transform: translateY(140px) scale(0.85);
            opacity: 0.2;
        }

        .wrapper.open .card {
            transform: translateY(-40px) scale(1);
            opacity: 1;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- หัวข้อด้านบน -->
    <div class="header" id="header">
        <h1 id="title-text">A Special Love Letter 💌</h1>
        <p id="sub-text">Tap anywhere to open your surprise! ✨</p>
    </div>

    <!-- พื้นที่คลิกเปิดซอง -->
    <div class="wrapper" id="wrapper" onclick="openEnvelope()">
        <div class="envelope">
            <div class="flap"></div>
            <div class="seal"></div>
        </div>

        <div class="card">
            <!-- ดึงรูป heart.png มาโชว์ -->
            <img src="heart.png" alt="Love Bear">
            <div class="card-text" id="typewriter"></div>
        </div>
    </div>

    <script>
        // ใส่ข้อความพร้อมอีโมจิหัวใจปิดท้าย ❤️
        const message = "You are my favorite person in this world ❤️";
        let index = 0;
        let isOpened = false;

        function openEnvelope() {
            if (isOpened) return;
            isOpened = true;

            // เล่นแอนิเมชันเปิดซอง
            document.getElementById('wrapper').classList.add('open');
            
            // เปลี่ยนข้อความหัวข้อด้านบน
            document.getElementById('title-text').innerText = "I Love You So Much! ❤️";
            document.getElementById('sub-text').innerText = "";

            // ค่อยๆ พิมพ์ข้อความบนการ์ด
            setTimeout(() => {
                typeWriter();
            }, 700);
        }

        function typeWriter() {
            if (index < message.length) {
                document.getElementById("typewriter").innerHTML += message.charAt(index);
                index++;
                setTimeout(typeWriter, 55);
            }
        }
    </script>
</body>
</html>
